name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest -v test_cheatcraft
      - run: python test_ui.py
      - name: Build portable package
        run: python build_release.py
      - name: Verify packaged executables
        run: python test_binary.py dist/CheatCraft
      - uses: actions/upload-artifact@v7
        with:
          name: CheatCraft-windows-x64
          path: |
            dist/CheatCraft-v*-windows-x64.zip
            dist/*.sha256
